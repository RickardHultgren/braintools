<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expandable Flow Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .node {
            stroke: #000;
            stroke-width: 1.5px;
        }
        .sub-node, .sub-sub-node {
            stroke: #000;
            stroke-width: 1px;
        }
        .arrow {
            fill: none;
            stroke: black;
            stroke-width: 2px;
            marker-end: url(#arrowhead);
        }
        .close {
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <svg width="800" height="600"></svg>
    <script>
        const svg = d3.select("svg");
        const width = +svg.attr("width");
        const height = +svg.attr("height");

        // Define arrowhead marker
        svg.append("defs").append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 5)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "black");

			//sort main nodes with start:true
			//sort sort rest of main nodes
			//
        const nodes = [
            { id: 1, start: true, x: width / 4, y: height / 2, width: 40, height: 40, collapsed: true },
            { id: 2, start: false, x: width / 2, y: height / 2, width: 40, height: 40, collapsed: true, subNodes: [
                { id: "2.1", start: true, x: width / 2 - 30, y: height / 2, width: 40, height: 40, collapsed: true, subNodes: [
                    { id: "2.1.1", start: true, x: width / 2 - 30, y: height / 2, width: 40, height: 40 },
                    { id: "2.1.2", start: false, x: width / 2 + 30, y: height / 2, width: 40, height: 40 }
                ]},
                { id: "2.2", start: false, x: width / 2 + 30, y: height / 2, width: 40, height: 40 }
            ]},
            { id: 3, start: false, x: (3 * width) / 4, y: height / 2, width: 40, height: 40, collapsed: true }
        ];

			//sub-nodes links?
        const links = [
            { source: nodes[0], target: nodes[1] },
            { source: nodes[1], target: nodes[2] }
        ];

        // Draw arrows
        svg.selectAll(".arrow")
            .data(links)
            .enter()
            .append("line")
            .attr("class", "arrow")
            .attr("x1", d => d.source.x + d.source.width / 2)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x - d.target.width / 2)
            .attr("y2", d => d.target.y);

        const nodeGroup = svg.selectAll("g")
            .data(nodes)
            .enter()
            .append("g")
            .attr("class", "node")
            .on("click", expandNode);

        nodeGroup.append("rect")
            .attr("x", d => d.x - d.width / 2)
            .attr("y", d => d.y - d.height / 2)
            .attr("width", d => d.width)
            .attr("height", d => d.height)
            .attr("fill", "lightblue");

        nodeGroup.append("text")
            .attr("x", d => d.x)
            .attr("y", d => d.y + 6)
            .attr("text-anchor", "middle")
            .text(d => d.id);

        function expandNode(event, d) {
            if (d.collapsed) {
                d.collapsed = false;
                render();
            }
        }

        function collapseNode(d) {
            d.collapsed = true;
            collapseSubNodes(d);
            render();
        }

        function collapseSubNodes(node) {
            if (node.subNodes) {
                node.subNodes.forEach(subNode => {
                    subNode.collapsed = true;
                    collapseSubNodes(subNode);
                });
            }
        }

        function render() {
            svg.selectAll("g.node").remove();

            const nodeGroup = svg.selectAll("g.node")
                .data(nodes)
                .enter()
                .append("g")
                .attr("class", "node")
                .on("click", (event, d) => {
                    event.stopPropagation();
                    if (d.collapsed) {
                        expandNode(event, d);
                    } else {
                        collapseNode(d);
                    }
                });

            nodeGroup.append("rect")
                .attr("x", d => d.x - d.width / 2)
                .attr("y", d => d.y - d.height / 2)
                .attr("width", d => d.width)
                .attr("height", d => d.height)
                .attr("fill", d => d.collapsed ? "lightblue" : "lightgreen");

            nodeGroup.append("text")
                .attr("x", d => d.x)
                .attr("y", d => d.y + 6)
                .attr("text-anchor", "middle")
                .text(d => d.id);

            nodeGroup.each(function (d) {
                if (!d.collapsed && d.subNodes) {
                    const subNodeGroup = d3.select(this).selectAll(".sub-node")
                        .data(d.subNodes)
                        .enter()
                        .append("g")
                        .attr("class", "sub-node")
                        .on("click", (event, subD) => {
                            event.stopPropagation();
                            if (subD.collapsed) {
                                subD.collapsed = false;
                                render();
                            } else {
                                subD.collapsed = true;
                                collapseSubNodes(subD);
                                render();
                            }
                        });

                    subNodeGroup.append("rect")
                        .attr("x", subD => subD.x - subD.width / 2)
                        .attr("y", subD => subD.y - subD.height / 2)
                        .attr("width", subD => subD.width)
                        .attr("height", subD => subD.height)
                        .attr("fill", "lightgreen");

                    subNodeGroup.append("text")
                        .attr("x", subD => subD.x)
                        .attr("y", subD => subD.y + 6)
                        .attr("text-anchor", "middle")
                        .text(subD => subD.id);

                    subNodeGroup.each(function (subD) {
                        if (!subD.collapsed && subD.subNodes) {
                            const subSubNodeGroup = d3.select(this).selectAll(".sub-sub-node")
                                .data(subD.subNodes)
                                .enter()
                                .append("g")
                                .attr("class", "sub-sub-node");

                            subSubNodeGroup.append("rect")
                                .attr("x", subSubD => subSubD.x - subSubD.width / 2)
                                .attr("y", subSubD => subSubD.y - subSubD.height / 2)
                                .attr("width", subSubD => subSubD.width)
                                .attr("height", subSubD => subSubD.height)
                                .attr("fill", "lightyellow");

                            subSubNodeGroup.append("text")
                                .attr("x", subSubD => subSubD.x)
                                .attr("y", subSubD => subSubD.y + 4)
                                .attr("text-anchor", "middle")
                                .text(subSubD => subSubD.id);
                        }
                    });


                }
            });
        }

        render();
    </script>
</body>
</html>
